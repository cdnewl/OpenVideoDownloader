<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset="1" stop-color="#22d3ee" />
          </linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="url(#g)" />
        <path d="M12 5.5v7.2M12 12.7l-3.6-3.6M12 12.7l3.6-3.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M7 16.6h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      </svg>
      <h1 id="pageTitle" data-i18n="extName"></h1>
    </div>
    <button id="btn-settings" class="icon-btn" title="Settings" data-i18n-attr="title:settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z" />
      </svg>
    </button>
  </header>

  <div id="notice" class="notice hidden"></div>

  <div id="filters" class="filters">
    <button class="chip active" data-f="all" data-i18n="filterAll"></button>
    <button class="chip" data-f="video" data-i18n="filterVideo"></button>
    <button class="chip" data-f="stream" data-i18n="filterStream"></button>
    <button class="chip" data-f="audio" data-i18n="filterAudio"></button>
  </div>

  <main id="list" class="list" role="list"></main>

  <div id="empty" class="empty hidden">
    <div class="empty-icon">🎬</div>
    <p class="empty-title" data-i18n="emptyTitle"></p>
    <p class="empty-hint" data-i18n="emptyHint"></p>
  </div>

  <footer class="ftr">
    <span id="count" class="count"></span>
    <div class="ftr-actions">
      <button id="btn-dl-all" class="btn primary" data-i18n="downloadAll"></button>
      <button id="btn-clear" class="btn subtle" data-i18n="clearAll"></button>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
