<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Open Video Downloader — Manager</title>
  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset="1" stop-color="#22d3ee" />
          </linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="url(#g)" />
        <path d="M12 5.5v7.2M12 12.7l-3.6-3.6M12 12.7l3.6-3.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M7 16.6h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      </svg>
      <h1 data-i18n="managerTitle"></h1>
    </div>
    <div class="hdr-hint" data-i18n="keepOpen"></div>
  </header>

  <main id="jobs" class="jobs"></main>

  <div id="empty" class="empty hidden">
    <p data-i18n="managerEmpty"></p>
  </div>

  <script type="module" src="manager.js"></script>
</body>
</html>
