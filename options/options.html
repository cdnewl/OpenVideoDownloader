<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Open Video Downloader — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="wrap">
    <h1 data-i18n="optionsTitle"></h1>

    <section class="card">
      <h2 data-i18n="sectionDetection"></h2>

      <label class="row">
        <input type="checkbox" id="detectAudio" />
        <span data-i18n="optDetectAudio"></span>
      </label>

      <label class="row">
        <input type="checkbox" id="includeSegments" />
        <span data-i18n="optIncludeSegments"></span>
      </label>

      <label class="row">
        <span data-i18n="optMinSize" class="grow"></span>
        <input type="number" id="minSizeMB" min="0" step="1" style="width: 90px" />
        <span>MB</span>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="sectionDownload"></h2>

      <label class="row">
        <span data-i18n="optConcurrency" class="grow"></span>
        <input type="range" id="concurrency" min="1" max="16" step="1" />
        <output id="concurrencyOut" style="width: 26px; text-align: right"></output>
      </label>

      <label class="row">
        <input type="checkbox" id="saveAs" />
        <span data-i18n="optSaveAs"></span>
      </label>

      <label class="row column">
        <span data-i18n="optSubdir"></span>
        <input type="text" id="downloadSubdir" placeholder="Open Video Downloader" />
      </label>

      <label class="row column">
        <span data-i18n="optTemplate"></span>
        <input type="text" id="filenameTemplate" />
        <small class="hint" data-i18n="optTemplateHint"></small>
      </label>
    </section>

    <div class="actions">
      <span id="saved" class="saved hidden" data-i18n="optSaved"></span>
      <button id="reset" class="btn subtle" data-i18n="optReset"></button>
      <button id="save" class="btn primary" data-i18n="optSave"></button>
    </div>
  </main>

  <script src="options.js"></script>
</body>
</html>
